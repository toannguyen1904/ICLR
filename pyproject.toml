[project]
name = "iclr"
version = "0.1.0"

dependencies=[
    "Pillow",
    "opencv-python",
    "tqdm",
    "tensorboard",
    "diffusers",
    "scipy",
    "timm",
    "matplotlib",
    "tyro",
    "loralib",
    "h5py",
    "wandb",
    "mediapy",
    "kinpy",
    "imgviz",
    "torch>=2.8.0",
    "torchaudio",
    "torchvision",
    "ffmpeg>=1.4",
    "ipykernel>=6.31.0",
    "termcolor>=3.3.0",
    "robosuite==1.4.0",
    "bddl>=3.6.0",
    "imageio>=2.37.4",
    "tensorflow>=2.20.0",
    "easydict>=1.13",
    "cloudpickle>=3.1.2",
    "gym>=0.26.2",
    "hydra-core>=1.3.4",
    "robomimic>=0.3.0",
    "thop>=0.1.1.post2209072238",
    "mujoco<3.10",
    "transforms3d>=0.4.2",
]

requires-python = ">=3.10,<3.11"
[tool.setuptools.packages.find]
include = ["iclr"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
